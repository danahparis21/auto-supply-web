  <!-- Shaft -->
  <rect x="68" y="56" width="24" height="20" fill="url(#metal)"/>
  <!-- Threads -->
  <g fill="url(#thread)" stroke="#27272a" stroke-width="1">
    <rect x="66" y="76" width="28" height="6" rx="2"/>
    <rect x="66" y="84" width="28" height="6" rx="2"/>
    <rect x="66" y="92" width="28" height="6" rx="2"/>
    <rect x="66" y="100" width="28" height="6" rx="2"/>
    <rect x="66" y="108" width="28" height="6" rx="2"/>
    <rect x="66" y="116" width="28" height="6" rx="2"/>
    <rect x="66" y="124" width="28" height="6" rx="2"/>
  </g>
  <!-- Tip -->
  <path d="M68 130 L92 130 L86 138 L74 138 Z" fill="#71717a"/>

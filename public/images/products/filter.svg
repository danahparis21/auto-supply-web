<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="canister" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="20" fill="url(#bg)"/>
  <!-- Top Gasket -->
  <ellipse cx="80" cy="30" rx="44" ry="12" fill="#09090b" stroke="#ef4444" stroke-width="3"/>
  <ellipse cx="80" cy="30" rx="22" ry="6" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
  <ellipse cx="80" cy="30" rx="10" ry="3" fill="#09090b"/>
  <!-- Filter Body -->
  <path d="M36 30 C36 30, 36 120, 42 130 C48 140, 112 140, 118 130 C124 120, 124 30, 124 30 Z" fill="url(#canister)"/>
  <!-- Fluting lines -->
  <line x1="50" y1="42" x2="50" y2="128" stroke="#1d4ed8" stroke-width="3" opacity="0.6"/>
  <line x1="65" y1="44" x2="65" y2="132" stroke="#60a5fa" stroke-width="2" opacity="0.8"/>
  <line x1="80" y1="44" x2="80" y2="133" stroke="#93c5fd" stroke-width="3" opacity="0.9"/>
  <line x1="95" y1="44" x2="95" y2="132" stroke="#60a5fa" stroke-width="2" opacity="0.8"/>
  <line x1="110" y1="42" x2="110" y2="128" stroke="#1d4ed8" stroke-width="3" opacity="0.6"/>
  <!-- Text on Filter -->
  <rect x="54" y="75" width="52" height="24" rx="3" fill="#0f172a" opacity="0.8"/>
  <text x="80" y="87" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#f8fafc" text-anchor="middle">VIC</text>
  <text x="80" y="95" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#93c5fd" text-anchor="middle">OIL FILTER</text>
</svg>
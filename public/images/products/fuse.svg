<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="fuseBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="20" fill="url(#bg)"/>
  <!-- Plastic Housing -->
  <rect x="42" y="28" width="76" height="54" rx="8" fill="url(#fuseBody)" opacity="0.9"/>
  <!-- Element window -->
  <rect x="62" y="38" width="36" height="34" rx="4" fill="#1e3a8a" opacity="0.8"/>
  <!-- S-shaped fuse wire -->
  <path d="M68 62 C72 62, 72 48, 80 48 C88 48, 88 62, 92 62" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
  <!-- Rating text -->
  <text x="80" y="34" font-family="system-ui, sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">15A</text>
  <!-- Blades / Prongs -->
  <rect x="52" y="82" width="16" height="52" rx="3" fill="url(#blade)" stroke="#52525b" stroke-width="1.5"/>
  <rect x="92" y="82" width="16" height="52" rx="3" fill="url(#blade)" stroke="#52525b" stroke-width="1.5"/>
</svg>
  <text x="80" y="96" font-family="system-ui, sans-serif" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">SPRAY</text>
  <text x="80" y="105" font-family="system-ui, sans-serif" font-size="6" font-weight="600" fill="#c084fc" text-anchor="middle">ACRYLIC</text>
